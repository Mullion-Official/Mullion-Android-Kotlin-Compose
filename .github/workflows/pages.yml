name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "gitbook/**"
      - "mullion-core/src/main/kotlin/**"
      - "mullion-compose/src/main/kotlin/**"
      - "mullion-view/src/main/kotlin/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitBook toolchain
        working-directory: gitbook
        run: npm ci

      - name: Build GitBook
        working-directory: gitbook
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitBook site
        uses: actions/upload-pages-artifact@v3
        with:
          path: gitbook/_book

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
